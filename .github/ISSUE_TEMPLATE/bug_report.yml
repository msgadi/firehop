name: Bug report
description: Something in Firehop does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Problems inside WhatsApp's own web app (chats, calls, status) belong to WhatsApp; Firehop shows it unchanged.
        **Never paste screenshots that show private chats, phone numbers or QR codes.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a second account
        2. Right-click it → Edit account…
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firehop version or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From `%LOCALAPPDATA%\io.github.firehop.desktop\logs`, if relevant. Remove anything personal.
      render: text
