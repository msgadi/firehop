name: Feature request
description: Suggest an idea for Firehop
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Fits Firehop's rules
      options:
        - label: It does not require injecting into, restyling or scraping WhatsApp's page (see ADR 0003).
          required: true
